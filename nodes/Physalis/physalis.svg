<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" fill="none">
  <!-- Physalis n8n node icon — lampion orange (référence à la baie Physalis dans son enveloppe) avec serrure stylisée -->
  <defs>
    <linearGradient id="physalisLantern" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <!-- Tige -->
  <line x1="30" y1="6" x2="30" y2="12" stroke="#365314" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Lampion (forme de baie Physalis) -->
  <path
    d="M30 12
       C 12 12, 8 22, 8 32
       C 8 44, 18 54, 30 54
       C 42 54, 52 44, 52 32
       C 52 22, 48 12, 30 12 Z"
    fill="url(#physalisLantern)"
    stroke="#7c2d12"
    stroke-width="1.5"
  />
  <!-- Nervures (rayures verticales) -->
  <path d="M30 14 L 30 52" stroke="#7c2d12" stroke-width="0.8" opacity="0.45"/>
  <path d="M18 16 Q 14 32, 18 50" stroke="#7c2d12" stroke-width="0.8" fill="none" opacity="0.45"/>
  <path d="M42 16 Q 46 32, 42 50" stroke="#7c2d12" stroke-width="0.8" fill="none" opacity="0.45"/>
  <!-- Serrure : cercle + trou -->
  <circle cx="30" cy="32" r="6" fill="#fff7ed" stroke="#7c2d12" stroke-width="1.5"/>
  <circle cx="30" cy="30" r="1.8" fill="#7c2d12"/>
  <rect x="29.2" y="30" width="1.6" height="5" rx="0.6" fill="#7c2d12"/>
</svg>
